name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/diary.spec.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diary-browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
